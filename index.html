<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Menu Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #080b12;
            background-image: 
                radial-gradient(circle at 50% 20%, #111827 0%, #080b12 80%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .menu-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .feature-card {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(55, 65, 81, 0.5);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .feature-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .feature-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Màu nền icon theo phong cách mẫu */
        .icon-blue { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .icon-purple { background: rgba(147, 51, 234, 0.15); color: #c084fc; border: 1px solid rgba(147, 51, 234, 0.3); }
        .icon-orange { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .icon-pink { background: rgba(236, 72, 153, 0.15); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }
        .icon-green { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .icon-folder { background: rgba(219, 39, 119, 0.15); color: #f43f5e; border: 1px solid rgba(219, 39, 119, 0.3); }

        .feature-info h3 {
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .feature-info p {
            color: #9ca3af;
            font-size: 12px;
        }

        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #374151;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #9ca3af;
            transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #4f46e5;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
            background-color: #ffffff;
        }

        /* Thư mục chọn tập tin */
        .file-card {
            background: rgba(17, 24, 39, 0.5);
            border: 1px dashed rgba(236, 72, 153, 0.4);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-card:hover {
            border-color: rgba(236, 72, 153, 0.8);
            background: rgba(17, 24, 39, 0.8);
        }

        /* Nút Khởi Chạy System ở dưới cùng */
        .launch-btn {
            width: 100%;
            padding: 16px;
            margin-top: 6px;
            background: linear-gradient(135deg, #1f1124 0%, #110c17 100%);
            border: 2px solid #ec4899;
            border-radius: 16px;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.3), inset 0 0 15px rgba(236, 72, 153, 0.1);
            transition: all 0.3s ease;
        }

        .launch-icon-bg {
            width: 32px;
            height: 32px;
            background: #ec4899;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px #ec4899;
            color: #fff;
            font-size: 14px;
        }

        .launch-btn:hover {
            box-shadow: 0 0 35px rgba(236, 72, 153, 0.6), inset 0 0 20px rgba(236, 72, 153, 0.3);
            border-color: #f472b6;
        }

        .launch-btn:active {
            transform: scale(0.98);
        }

        /* Trạng thái Active cho nút khởi chạy */
        .launch-btn.active {
            border-color: #10b981;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.5), inset 0 0 15px rgba(16, 185, 129, 0.2);
            background: linear-gradient(135deg, #06241a 0%, #03150f 100%);
        }

        .launch-btn.active .launch-icon-bg {
            background: #10b981;
            box-shadow: 0 0 15px #10b981;
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <!-- Aimlock Pro -->
        <div class="feature-card">
            <div class="feature-left">
                <div class="icon-box icon-blue">👤</div>
                <div class="feature-info">
                    <h3>Aimlock Pro</h3>
                    <p>Bám siêu chặt.</p>
                </div>
            </div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>

        <!-- Aimbot mode -->
        <div class="feature-card">
            <div class="feature-left">
                <div class="icon-box icon-purple">🌐</div>
                <div class="feature-info">
                    <h3>Aimbot mode</h3>
                    <p>Bắt tâm siêu dính.</p>
                </div>
            </div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>

        <!-- Fix Lag Device -->
        <div class="feature-card">
            <div class="feature-left">
                <div class="icon-box icon-orange">📄</div>
                <div class="feature-info">
                    <h3>Fix Lag Device</h3>
                    <p>Tối ưu dung lượng RAM.</p>
                </div>
            </div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>

        <!-- Bypass Antiban -->
        <div class="feature-card">
            <div class="feature-left">
                <div class="icon-box icon-pink">📍</div>
                <div class="feature-info">
                    <h3>Bypass Antiban</h3>
                    <p>Cân acc chính và chơi được rank.</p>
                </div>
            </div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>

        <!-- Sensitivity -->
        <div class="feature-card">
            <div class="feature-left">
                <div class="icon-box icon-green">⚙️</div>
                <div class="feature-info">
                    <h3>Sensitivity</h3>
                    <p>Bắn siêu nhạy.</p>
                </div>
            </div>
            <label class="switch"><input type="checkbox"><span class="slider"></span></label>
        </div>

        <!-- Get System File -->
        <div class="file-card" onclick="alert('Đã mở hộp thoại chọn tập tin!')">
            <div class="icon-box icon-folder">📥</div>
            <div class="feature-info">
                <h3>Get System File...</h3>
                <p>Nhấp vào đây để chọn tập tin</p>
            </div>
        </div>

        <!-- Nút Khởi chạy System -->
        <button class="launch-btn" id="launchBtn" onclick="toggleLaunch()">
            <div class="launch-icon-bg">🔑</div>
            <span id="launchText">KHỞI CHẠY SYSTEM</span>
        </button>
    </div>

    <script>
        function toggleLaunch() {
            const btn = document.getElementById('launchBtn');
            const text = document.getElementById('launchText');
            
            if (btn.classList.contains('active')) {
                btn.classList.remove('active');
                text.innerText = "KHỞI CHẠY SYSTEM";
            } else {
                btn.classList.add('active');
                text.innerText = "SYSTEM: ACTIVE";
            }
        }
    </script>

</body>
</html>
